name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 2.0.x is the floor iwork.nimble declares
        nim: ['2.0.x', stable, devel]
    runs-on: ubuntu-latest
    # devel is allowed to break us without failing the workflow
    continue-on-error: ${{ matrix.nim == 'devel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install deps
        run: nimble install -d -y
      - name: run tests
        run: nimble test

  compile-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install deps
        run: nimble install -d -y
      - name: compile examples and tools
        run: |
          for f in examples/*.nim tools/*.nim; do
            case "$f" in *config.nims) continue;; esac
            echo "compiling $f"
            nim c --hints:off "$f"
          done
      # proves the nimble package installs the cli and still ships the library
      - name: install and smoke test iworkextract
        run: |
          nimble install -y
          "$HOME/.nimble/bin/iworkextract" --version
          "$HOME/.nimble/bin/iworkextract" tests/fixtures/simple.pages
          "$HOME/.nimble/bin/iworkextract" --json tests/fixtures/simple.key | python3 -m json.tool > /dev/null
          "$HOME/.nimble/bin/iworkextract" --csv --sheet 1 --table 1 tests/fixtures/rich.numbers
          ls "$HOME"/.nimble/pkgs2/iwork-*/iwork.nim
